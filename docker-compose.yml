services:
  mysql:
    image: mysql:8.4
    container_name: point-payment-lab-mysql
    ports:
      # 기본은 로컬에서만 접근 가능하다. 운영에서는 DB 포트를 공인망에
      # 노출하지 말고 애플리케이션과 DB를 같은 private network에 둔다.
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-point_payment_lab}
      MYSQL_USER: ${MYSQL_USER:-lab}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lab}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - point-payment-lab-mysql:/var/lib/mysql

volumes:
  point-payment-lab-mysql:

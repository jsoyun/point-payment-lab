services:
  mysql:
    image: mysql:8.4
    container_name: point-payment-lab-mysql
    ports:
      # 기본은 로컬에서만 접근 가능하다. 운영에서는 DB 포트를 공인망에
      # 노출하지 말고 애플리케이션과 DB를 같은 private network에 둔다.
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-point_payment_lab}
      MYSQL_USER: ${MYSQL_USER:-lab}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lab}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - point-payment-lab-mysql:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    container_name: point-payment-lab-redis
    ports:
      # 로컬 실습용 바인딩이다. 운영에서는 Redis를 공인망에 노출하지 않고
      # 애플리케이션과 같은 private network에서만 접근한다.
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - point-payment-lab-redis:/data

volumes:
  point-payment-lab-mysql:
  point-payment-lab-redis:
